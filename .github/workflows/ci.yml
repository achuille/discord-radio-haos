name: Validate radio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: radio
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: radio/package-lock.json
      - name: Configure official Ubuntu mirror and bounded downloads
        timeout-minutes: 1
        run: |
          # Keep Ubuntu suites, components and signing keys; replace only the stalled Azure mirror.
          sudo find /etc/apt -maxdepth 2 -type f \
            \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' {} +
          sudo tee /etc/apt/apt.conf.d/99radio-ci-network >/dev/null <<'APT'
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::Retries "2";
          Acquire::ForceIPv4 "true";
          APT
      - name: Install native build and audio tools
        timeout-minutes: 6
        run: sudo apt-get update --error-on=any && sudo apt-get install -y --no-install-recommends ffmpeg python3 make g++ pkg-config libopus-dev
      - run: npm ci --no-audit --no-fund
      - run: npm test
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            ha_arch: amd64
          - platform: linux/arm64
            ha_arch: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build locally, never publish
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: ./radio
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: discord-radio:ci
          build-args: |
            BUILD_ARCH=${{ matrix.ha_arch }}
            BUILD_VERSION=0.2.0
      - name: Verify native audio dependencies without network or token
        run: |
          docker run --rm --network none --platform '${{ matrix.platform }}' \
            --entrypoint node discord-radio:ci --input-type=module -e \
            "import opus from '@discordjs/opus'; const { OpusEncoder } = opus; import '@discordjs/voice'; import '@snazzah/davey'; new OpusEncoder(48000, 2); console.log('Native audio dependencies loaded');"
          docker run --rm --network none --platform '${{ matrix.platform }}' \
            --entrypoint ffmpeg discord-radio:ci -version
      - name: Boot actual image without credentials or external network
        shell: bash
        run: |
          container="radio-startup-${{ matrix.ha_arch }}"
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          docker run --detach --name "$container" --network none \
            --platform '${{ matrix.platform }}' --tmpfs /data:rw,noexec,nosuid,size=16m \
            discord-radio:ci
          docker exec "$container" node --input-type=module -e '
            import { setTimeout } from "node:timers/promises";
            import { readFile } from "node:fs/promises";
            let ready = false;
            for (let attempt = 0; attempt < 30; attempt++) {
              try {
                const state = JSON.parse(await readFile("/data/settings.json", "utf8"));
                if (state.nativeConfiguration === true) { ready = true; break; }
              } catch {}
              await setTimeout(1000);
            }
            if (!ready) throw new Error("Worker did not initialize private state");
            await setTimeout(2000);
            try {
              await fetch("http://127.0.0.1:8080/health", { signal: AbortSignal.timeout(1000) });
              throw new Error("Unexpected web listener");
            } catch (error) { if (error.message === "Unexpected web listener") throw error; }
            console.log("Native-config worker initialized without a web listener (not a HAOS installation test)");
          '
          test "$(docker inspect --format '{{.State.Running}}' "$container")" = true
          docker stop --time 15 "$container" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
