configuration:
  discord_token:
    name: Discord token
    description: Dedicated account secret. Never publish it. Selfbot use can cause account suspension.
  auth_mode:
    name: Authentication mode
    description: Only selfbot is supported; do not use an official bot token.
  guild_id:
    name: Discord server ID
    description: Numeric server ID, not its name.
  voice_channel_id:
    name: Initial voice channel
    description: Initial channel ID. Server-directed moves are followed without returning to the channel-creation lobby.
  sources:
    name: Public audio sources
    description: Up to 20 public HTTP(S) audio files or Google Drive folder URLs. Save and restart. Empty list disables all sources; an omitted option preserves/migrates legacy sources. Show optional settings if this field is hidden.
  volume:
    name: Volume
    description: From 0 (muted) to 1. Save and restart to apply.
  playback_enabled:
    name: Enable playback
    description: Disable and restart to stop playback and voice connection while continuing source synchronization.
  scan_interval_seconds:
    name: Cache scan interval (seconds)
    description: Local track discovery interval, from 10 to 3600 seconds.
  sync_interval_seconds:
    name: Source sync interval (seconds)
    description: Public source refresh interval, from 60 to 86400 seconds. Unchanged direct files are reused when the server supports conditional requests.
  max_track_seconds:
    name: Maximum track duration (seconds)
    description: Playback safety limit, from 30 to 86400 seconds. Infinite/live streams are not supported.
