name: Discord Radio
version: "0.1.0"
slug: radio
url: https://github.com/achuille/discord-radio-haos
description: Radio Discord avec sources audio et interface Home Assistant
stage: experimental
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
timeout: 30
host_network: false
hassio_api: false
homeassistant_api: false
docker_api: false
full_access: false
apparmor: true
ingress: true
ingress_port: 8080
panel_icon: mdi:radio
panel_title: Discord Radio
panel_admin: true
watchdog: "http://[HOST]:8080/health"
options:
  discord_token: ""
  guild_id: ""
  voice_channel_id: ""
  auth_mode: selfbot
  volume: 0.6
  scan_interval_seconds: 60
  max_track_seconds: 14400
schema:
  discord_token: password
  auth_mode: "list(selfbot)"
  guild_id: "match(^([0-9]{17,20})?$)"
  voice_channel_id: "match(^([0-9]{17,20})?$)"
  volume: "float(0,1)"
  scan_interval_seconds: "int(10,3600)"
  max_track_seconds: "int(30,86400)"
