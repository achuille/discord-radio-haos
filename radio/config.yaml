name: Discord Radio
version: "0.2.0"
slug: radio
url: https://github.com/achuille/discord-radio-haos
description: Radio Discord pilotée par la configuration native Home Assistant
stage: experimental
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
timeout: 30
host_network: false
hassio_api: false
homeassistant_api: false
docker_api: false
full_access: false
apparmor: true
options:
  discord_token: ""
  guild_id: ""
  voice_channel_id: ""
  auth_mode: selfbot
  volume: 0.6
  playback_enabled: true
  scan_interval_seconds: 60
  sync_interval_seconds: 900
  max_track_seconds: 14400
schema:
  discord_token: "password(0,8192)"
  auth_mode: "list(selfbot)"
  guild_id: "match(^([0-9]{17,20})?$)"
  voice_channel_id: "match(^([0-9]{17,20})?$)"
  # No default: omitted means preserve/migrate old sources, explicit [] clears them.
  sources:
    - "url?"
  volume: "float(0,1)"
  playback_enabled: bool
  scan_interval_seconds: "int(10,3600)"
  sync_interval_seconds: "int(60,86400)"
  max_track_seconds: "int(30,86400)"
